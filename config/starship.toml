format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$cmd_duration $jobs $time\
$line_break\
character"""

[fill]
symbol = " "

[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style) '
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '󰚌 [$hostname](bold red) '
trim_at = '.'
disabled = false

[directory]
style = "blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

# --- Python ---
[python]
symbol = " "
style = "yellow"
format = "[$symbol$version ($virtualenv)]($style) "
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "Pipfile"]

# --- Rust ---
[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "
detect_files = ["Cargo.toml"]

# --- Shell scripts ---
[shell]
disabled = false
style = "green"
format = "[$indicator]($style) "
bash_indicator = "bash "
zsh_indicator = "zsh "
fish_indicator = "fish "
nu_indicator = "nu "
powershell_indicator = "pwsh "
