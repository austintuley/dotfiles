format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$python\
$rust\
$fill\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style) '
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '󰚌 [$hostname](bold red) '
trim_at = '.'
disabled = false


